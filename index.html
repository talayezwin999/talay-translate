<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talay Translate - เว็บแปลภาษาฟรี</title>
  <meta name="description" content="เว็บแปลภาษาฟรี แปลไทย อังกฤษ ญี่ปุ่น จีน เกาหลี และอีกหลายภาษา ใช้งานง่าย ไม่ต้องสมัครสมาชิก">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Noto Sans Thai", sans-serif;
      background: #eaf6fb;
      color: #1f3a4d;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { margin: 0 0 20px; color: #5b7a8c; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    select {
      flex: 1;
      padding: 10px;
      border: 1px solid #c5dbe6;
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
    }
    textarea {
      width: 100%;
      height: 130px;
      padding: 12px;
      border: 1px solid #c5dbe6;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 12px;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    #translateBtn {
      width: 100%;
      background: #1c8fc4;
      color: #fff;
      font-weight: 600;
      margin-bottom: 12px;
    }
    #translateBtn:disabled { opacity: 0.6; cursor: wait; }
    #swapBtn { background: #e3f1f8; }
    #result {
      min-height: 130px;
      padding: 12px;
      background: #f4fafd;
      border: 1px solid #c5dbe6;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    #copyBtn { margin-top: 8px; background: #e3f1f8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌊 translate for 0Rg4n</h1>
    <p class="sub">แปลภาษาฟรี i luv u organ🤍</p>

    <div class="row">
      <select id="fromLang">
        <option value="Autodetect">ตรวจจับภาษาอัตโนมัติ</option>
        <option value="th">ไทย</option>
        <option value="en">อังกฤษ</option>
        <option value="ja">ญี่ปุ่น</option>
        <option value="zh-CN">จีน</option>
        <option value="ko">เกาหลี</option>
        <option value="fr">ฝรั่งเศส</option>
        <option value="de">เยอรมัน</option>
        <option value="es">สเปน</option>
      </select>
      <button id="swapBtn" title="สลับภาษา">⇄</button>
      <select id="toLang">
        <option value="th">ไทย</option>
        <option value="en" selected>อังกฤษ</option>
        <option value="ja">ญี่ปุ่น</option>
        <option value="zh-CN">จีน</option>
        <option value="ko">เกาหลี</option>
        <option value="fr">ฝรั่งเศส</option>
        <option value="de">เยอรมัน</option>
        <option value="es">สเปน</option>
      </select>
    </div>

    <textarea id="inputText" placeholder="พิมพ์ข้อความที่ต้องการแปล..."></textarea>
    <button id="translateBtn">แปล</button>

    <div id="result">คำแปลจะแสดงตรงนี้</div>
    <button id="copyBtn">คัดลอกคำแปล</button>
  </div>

  <script>
    const fromLang = document.getElementById("fromLang");
    const toLang = document.getElementById("toLang");
    const inputText = document.getElementById("inputText");
    const result = document.getElementById("result");
    const translateBtn = document.getElementById("translateBtn");

    async function translate() {
      const text = inputText.value.trim();
      if (!text) {
        result.textContent = "กรุณาพิมพ์ข้อความก่อนนะคะ";
        return;
      }

      translateBtn.disabled = true;
      result.textContent = "กำลังแปล...";

      try {
        const pair = encodeURIComponent(fromLang.value + "|" + toLang.value);
        const url = "https://api.mymemory.translated.net/get?q=" +
                    encodeURIComponent(text) + "&langpair=" + pair;
        const response = await fetch(url);
        const data = await response.json();
        result.textContent = data.responseData.translatedText;
      } catch (error) {
        result.textContent = "แปลไม่สำเร็จ ลองใหม่อีกครั้งนะคะ";
      } finally {
        translateBtn.disabled = false;
      }
    }

    translateBtn.addEventListener("click", translate);

    document.getElementById("swapBtn").addEventListener("click", () => {
      if (fromLang.value === "Autodetect") return;
      const temp = fromLang.value;
      fromLang.value = toLang.value;
      toLang.value = temp;
    });

    document.getElementById("copyBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(result.textContent);
    });
  </script>
</body>
</html>
